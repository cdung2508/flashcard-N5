<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcard Học Từ Vựng</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lessons.css">
  <script src="components/navbar.js" defer></script>
</head>

<body data-page="lessons">

  <div class="main-container">
    <header class="page-header">
      <h1 class="page-title">📘 Flashcard Từ Vựng Nhật - Việt</h1>
      <p class="page-subtitle">Học từ vựng qua thẻ ghi nhớ kèm ví dụ minh họa & quiz ôn tập</p>
    </header>

    <div class="top-bar">
      <select id="lesson">
        <!-- Populated dynamically by lessons.js based on selected JLPT level -->
      </select>

      <select id="direction">
        <option value="jp-vn">Nhật → Việt</option>
        <option value="vn-jp">Việt → Nhật</option>
      </select>
    </div>

    <div class="card-container" id="cardContainer">
      <div class="card" id="card">
        <div class="front" id="frontText">Bấm để xem nghĩa</div>
        <div class="back" id="backText">...</div>
      </div>
    </div>

    <div id="quizArea" style="display: none;">
      <input type="text" id="quizInput" placeholder="Nhập nghĩa...">
      <br><br>
      <button id="btnCheckAnswer" style="width: 100%;">Kiểm tra</button>
      <div id="feedback"></div>
      <div id="summary"></div>
    </div>

    <div class="controls">
      <button id="btnPrev">⬅ Trước</button>
      <button id="btnNext">Tiếp ➡</button>
    </div>

    <div id="exampleBox" class="example-box" style="display:none;">
      <div class="example-header">
        📝 Ví dụ
      </div>

      <div class="example-content">
        <div id="exampleJp"></div>
        <div id="exampleVn"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/lessons.js"></script>
</body>

</html>
